AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  CASCADE: glacial lake telemetry and outburst-flood routing. One
  container image, one Lambda function per pipeline step, a Standard
  Step Functions workflow that emails each dossier, and a dam dossier page.
  Deploy to us-west-2, beside the Sentinel-2 data.

Parameters:
  MeasureConcurrencyCap:
    Type: Number
    Default: 8
    MinValue: 0
    Description: >-
      Reserved concurrency for the measure function, which also caps the
      load on Earth Search. Use 0 to leave it unreserved, e.g. if the
      account's Lambda concurrency quota is too low to reserve from.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
  BudgetLimitUsd:
    Type: Number
    Default: 20
    MinValue: 1
    Description: >-
      Monthly AWS spend, before credits, that triggers the budget alerts
      (80% actual, 100% forecast).

Conditions:
  CapMeasureConcurrency: !Not [!Equals [!Ref MeasureConcurrencyCap, 0]]

# Functions run outside any VPC: they need the public internet for the
# Earth Search STAC API, and a NAT gateway would cost money every hour.
# Open data (Sentinel-2, Copernicus DEM) is read over unsigned HTTPS, so
# no IAM permission covers it.
Globals:
  Function:
    Architectures:
      - x86_64
    Environment:
      Variables:
        BUCKET_NAME: !Ref ResultsBucket
        TABLE_NAME: !Ref ObservationsTable
        CPL_TMPDIR: /tmp
        PROJ_NETWORK: "OFF"

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub "${ResultsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # The dam dossier page: its files sit in a private bucket and a small
  # function serves them, with the published results, at a function URL.
  # (CloudFront needs this AWS account to be verified first.)
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  SiteFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Zip
      Runtime: python3.14
      CodeUri: site_function/
      Handler: app.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
      FunctionUrlConfig:
        AuthType: NONE
      LoggingConfig:
        LogGroup: !Ref SiteLogGroup
      Policies:
        - Statement:
            - Sid: ReadPageFiles
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
            # The dossier, the observed outlines and the flow path only.
            - Sid: ReadPublishedResults
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ResultsBucket.Arn}/reports/*"
                - !Sub "${ResultsBucket.Arn}/obs/*"
                - !Sub "${ResultsBucket.Arn}/terrain/*"

  # Alerts: each published dossier, budget warnings and failed runs.
  # Subscribers are added outside the template, so no address is in git.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: CASCADE

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BudgetsAndAlarmsPublish
            Effect: Allow
            Principal:
              Service:
                - budgets.amazonaws.com
                - cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Tracks spend before credits, so the credits themselves are protected.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertTopic

  PipelineFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A CascadePipeline execution failed.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref CascadePipeline
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ObservationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers.plan.handler"]
      # Importing the shared geospatial stack filled 256 MB in a local run.
      MemorySize: 512
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref PlanLogGroup
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.14

  MeasureFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers.measure.handler"]
      MemorySize: 3008
      Timeout: 900
      ReservedConcurrentExecutions: !If
        - CapMeasureConcurrency
        - !Ref MeasureConcurrencyCap
        - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup: !Ref MeasureLogGroup
      Policies:
        - Statement:
            - Sid: ReadFootprints
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ResultsBucket.Arn}/footprints/*"
            - Sid: WriteObservations
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ResultsBucket.Arn}/obs/*"
            - Sid: MissingKeysReadAsNotFound
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ResultsBucket.Arn
            - Sid: StoreObservations
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ObservationsTable.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.14

  RouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers.route.handler"]
      MemorySize: 2048
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref RouteLogGroup
      Policies:
        - Statement:
            - Sid: CacheChannelGeometry
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${ResultsBucket.Arn}/terrain/*"
            - Sid: WriteScenarios
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ResultsBucket.Arn}/scenarios/*"
            - Sid: MissingKeysReadAsNotFound
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ResultsBucket.Arn
            - Sid: StoreImpacts
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ObservationsTable.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.14

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers.report.handler"]
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref ReportLogGroup
      Policies:
        - Statement:
            - Sid: ReadOutlines
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ResultsBucket.Arn}/obs/*"
                - !Sub "${ResultsBucket.Arn}/footprints/*"
            - Sid: WriteFootprintsAndReports
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "${ResultsBucket.Arn}/footprints/*"
                - !Sub "${ResultsBucket.Arn}/reports/*"
            - Sid: MissingKeysReadAsNotFound
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ResultsBucket.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python3.14

  CascadePipeline:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: statemachine/cascade.asl.json
      DefinitionSubstitutions:
        PlanFunctionArn: !GetAtt PlanFunction.Arn
        MeasureFunctionArn: !GetAtt MeasureFunction.Arn
        RouteFunctionArn: !GetAtt RouteFunction.Arn
        ReportFunctionArn: !GetAtt ReportFunction.Arn
        AlertTopicArn: !Ref AlertTopic
        SiteUrl: !GetAtt SiteFunctionUrl.FunctionUrl
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PlanFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MeasureFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RouteFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ReportFunction
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
        - Statement:
            # Vended log delivery for Step Functions only accepts "*".
            - Sid: StateMachineLogDelivery
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  PlanLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cascade/${AWS::StackName}/plan"
      RetentionInDays: !Ref LogRetentionDays

  MeasureLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cascade/${AWS::StackName}/measure"
      RetentionInDays: !Ref LogRetentionDays

  RouteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cascade/${AWS::StackName}/route"
      RetentionInDays: !Ref LogRetentionDays

  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cascade/${AWS::StackName}/report"
      RetentionInDays: !Ref LogRetentionDays

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cascade/${AWS::StackName}/statemachine"
      RetentionInDays: !Ref LogRetentionDays

  SiteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/cascade/${AWS::StackName}/site"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ResultsBucketName:
    Value: !Ref ResultsBucket
  ObservationsTableName:
    Value: !Ref ObservationsTable
  PipelineArn:
    Value: !Ref CascadePipeline
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteUrl:
    Value: !GetAtt SiteFunctionUrl.FunctionUrl
  AlertTopicArn:
    Value: !Ref AlertTopic
